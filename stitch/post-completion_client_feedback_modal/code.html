<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post-Completion Client Feedback Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102222",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .fill-primary {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex items-center justify-center p-4">
<!-- Modal Backdrop Overlay -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
<!-- Modal Container -->
<div class="relative w-full max-w-[640px] bg-background-light dark:bg-[#193333] rounded-xl shadow-2xl overflow-hidden flex flex-col border border-white/10">
<!-- Close Button -->
<button class="absolute top-4 right-4 text-[#92c9c9] hover:text-white transition-colors">
<span class="material-symbols-outlined text-[28px]">close</span>
</button>
<!-- Celebratory Header Section -->
<div class="relative pt-10 pb-6 px-8 flex flex-col items-center text-center overflow-hidden">
<!-- Abstract Confetti Graphics (Represented by Icons) -->
<div class="absolute top-4 left-10 text-primary opacity-40 rotate-12">
<span class="material-symbols-outlined text-4xl">celebration</span>
</div>
<div class="absolute top-12 right-12 text-primary opacity-40 -rotate-12">
<span class="material-symbols-outlined text-3xl">star</span>
</div>
<div class="absolute bottom-4 left-16 text-primary opacity-20 rotate-45">
<span class="material-symbols-outlined text-2xl">auto_awesome</span>
</div>
<div class="bg-primary/20 p-4 rounded-full mb-4">
<span class="material-symbols-outlined text-primary text-[48px]">task_alt</span>
</div>
<h2 class="text-gray-900 dark:text-white text-3xl font-black leading-tight tracking-tight">You're All Set! 🚀</h2>
<p class="text-gray-600 dark:text-[#92c9c9] text-lg font-normal mt-2">
                    Success! Your project is complete. How was your experience with the WebAsia team?
                </p>
</div>
<!-- Content Container -->
<div class="px-8 pb-10 flex flex-col gap-6">
<!-- Rating Summary Section -->
<div class="flex flex-col items-center gap-3">
<p class="text-gray-900 dark:text-white text-base font-semibold">Rate your experience</p>
<div class="flex gap-2">
<button class="text-primary hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[40px] fill-primary">star</span>
</button>
<button class="text-primary hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[40px] fill-primary">star</span>
</button>
<button class="text-primary hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[40px] fill-primary">star</span>
</button>
<button class="text-primary hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[40px] fill-primary">star</span>
</button>
<button class="text-primary/30 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[40px]">star</span>
</button>
</div>
</div>
<!-- Feedback Text Area -->
<div class="flex flex-col gap-2">
<label class="text-gray-900 dark:text-white text-base font-medium">Share your thoughts</label>
<textarea class="w-full rounded-xl text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-gray-200 dark:border-[#326767] bg-white dark:bg-[#112222] min-h-[120px] placeholder:text-gray-400 dark:placeholder:text-[#92c9c9] p-4 text-base font-normal leading-relaxed resize-none transition-all" placeholder="Your feedback helps us improve..."></textarea>
</div>
<!-- Showcase Settings Panel -->
<div class="flex flex-col gap-4">
<p class="text-gray-900 dark:text-white text-base font-semibold uppercase tracking-wider text-xs opacity-70">Showcase Settings</p>
<!-- Toggle Switch -->
<div class="flex items-center justify-between gap-4 rounded-xl border border-gray-200 dark:border-[#326767] bg-gray-50 dark:bg-[#112222] p-4 transition-colors">
<div class="flex flex-col gap-1">
<p class="text-gray-900 dark:text-white text-base font-bold leading-tight">Public Consent</p>
<p class="text-gray-500 dark:text-[#92c9c9] text-sm font-normal leading-normal">Allow WebAsia to display this feedback on the public website</p>
</div>
<label class="relative flex h-[31px] min-w-[51px] cursor-pointer items-center rounded-full border-none bg-gray-300 dark:bg-[#234848] p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary transition-all">
<div class="h-full w-[27px] rounded-full bg-white shadow-md"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
<!-- Portfolio Checkbox -->
<label class="flex items-start gap-4 p-4 rounded-xl border border-gray-200 dark:border-[#326767] bg-gray-50 dark:bg-[#112222] cursor-pointer hover:bg-gray-100 dark:hover:bg-[#1a3838] transition-colors">
<div class="flex items-center h-6">
<input class="h-5 w-5 rounded border-gray-300 dark:border-[#326767] text-primary bg-white dark:bg-[#112222] focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
</div>
<div class="flex flex-col">
<p class="text-gray-900 dark:text-white text-base font-bold leading-tight">Portfolio Inclusion</p>
<p class="text-gray-500 dark:text-[#92c9c9] text-sm font-normal leading-normal">Include my design in the public portfolio showcase</p>
</div>
</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark py-4 px-6 rounded-xl font-bold text-lg shadow-lg shadow-primary/20 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
<span>Submit &amp; Close</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">send</span>
</button>
<p class="text-center text-gray-400 dark:text-[#92c9c9]/60 text-xs font-medium uppercase tracking-widest">
                    WebAsia Creative Services Platform
                </p>
</div>
</div>
</div>
<!-- Hidden background element to ensure the layout matches user prompt style -->
<div class="hidden">
<img data-alt="Abstract dark geometric gradient pattern" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBIpxWUFnWaZzp-vP-vD46nwMEH2GP2kf8ZAkK9rdxsAoZ-9lvc0lmD7KfRDlQbg8Z089206uJy9gdkBaeAdH81DT8AIYhHPdG-eB6BR9hnl1DqReD7oBX3hr-qTcYZx0uPXaCUk7FwhIVNSnu4AKl1L0XQ1FPdYbrMcf3ICx9r2Yb3cyTCL8IW_Qbnlyzg5YoDKmuUulTyQpYZMFJwB1tuil4sxfnxo1uLtFxll7wdhxRX0aMYDWlqPyyCiE1WOujojwwd14YIC9M"/>
</div>
</body></html>
